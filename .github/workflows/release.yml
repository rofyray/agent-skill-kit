name: Release skill archives

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog
        run: |
          python3 scripts/validate_skills.py
          python3 -m unittest discover -s tests -v
      - name: Build individual skill archives
        run: python3 scripts/package_skills.py
      - name: Write checksums
        working-directory: dist/skills
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/skills/* --generate-notes --verify-tag
