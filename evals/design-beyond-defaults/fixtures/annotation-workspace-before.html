<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annotation workspace - design prototype</title><style>body{font:16px/1.6 Arial,sans-serif;color:#30281f;background:#f7f1e7;margin:0}main{max-width:1100px;margin:auto;padding:32px}h1,h2,h3{font-family:Georgia,serif;line-height:1.2}h1{font-size:42px}a{color:#704522}button,input,select,textarea{font:inherit}button{background:#704522;color:#fff;border:1px solid #704522;padding:12px;border-radius:.15rem}input,select,textarea{background:#fffaf2;color:#30281f;border:1px solid #655747;padding:10px;max-width:100%}:focus-visible{outline:3px solid #704522;outline-offset:3px}.note{color:#655747;font-size:14px}section{border-top:1px solid #655747;padding-top:20px;margin-top:28px}label{display:block}textarea{width:100%;min-height:160px}.grid{display:grid;grid-template-columns:200px 1fr 280px;gap:24px}.reading{max-width:64ch}.terms{max-width:600px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:20px}h1{font-size:34px}}</style><main><p class="note">Design prototype · no documents loaded</p><h1>Research annotations</h1><div class="grid"><nav aria-label="Document collection"><h2>Documents</h2><label for="filter">Filter documents</label><input id="filter" type="search" disabled aria-describedby="no-docs"><p id="no-docs">No source documents supplied.</p></nav><section aria-label="Reading pane"><h2>Reader</h2><p>Choose an imported source to read and annotate. Import integration is not connected in this prototype.</p></section><aside><h2>Annotations</h2><label for="note">Note</label><textarea id="note" disabled aria-describedby="note-help"></textarea><p id="note-help">Select a passage in a loaded document to attach a note.</p><button type="button" disabled>Save annotation</button></aside></div></main></html>
