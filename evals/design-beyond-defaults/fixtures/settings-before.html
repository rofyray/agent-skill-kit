<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote settings</title><style>:root{--brand:#5432a8;--surface:#fff;--ink:#201731}*{box-sizing:border-box}body{font:16px/1.5 system-ui;color:var(--ink);max-width:760px;margin:32px auto;padding:16px}button,input,select{font:inherit;padding:10px;max-width:100%}button{background:var(--brand);color:white}label{display:block;margin-top:16px}:focus-visible{outline:3px solid #5432a8;outline-offset:3px}header{background:linear-gradient(90deg,#5432a8,#8b3a72);color:white;padding:20px}form{border:1px solid #888;padding:20px}a{color:var(--brand)}</style><header><h1>Fieldnote</h1><p>Team settings</p></header><main><p>Plan: Studio, $24 per month. Three seats included.</p><a href="#billing">Billing details</a><form id="settings"><label for="email">Billing email</label><input id="email" name="email" type="email" required value="owner@example.com"><label for="zone">Timezone</label><select id="zone" name="zone"><option>Europe/London</option><option>America/Los_Angeles</option></select><label><input type="checkbox" id="digest" name="digest" checked> Weekly digest</label><button data-analytics="settings-save" type="submit">Save settings</button><p role="status" id="status"></p></form><section id="billing"><h2>Billing details</h2><p>Cancel at any time. Access remains until the end of the paid month.</p></section></main><script>const form=document.querySelector('#settings');const prior=JSON.parse(localStorage.getItem('fieldnote-settings')||'null');if(prior){form.email.value=prior.email;form.zone.value=prior.zone;form.digest.checked=prior.digest}form.addEventListener('submit',function saveSettings(event){event.preventDefault();localStorage.setItem('fieldnote-settings',JSON.stringify({email:form.email.value,zone:form.zone.value,digest:form.digest.checked}));document.querySelector('#status').textContent='Settings saved';window.lastAnalyticsEvent='settings-save'});</script></html>
