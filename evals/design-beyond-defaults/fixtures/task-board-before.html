<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance tasks</title><style>body{font:16px/1.5 system-ui;margin:24px;color:#172c27}button{font:inherit;padding:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #777}:focus-visible{outline:3px solid #185442;outline-offset:3px}</style><main><h1>Maintenance tasks</h1><button id="reload">Refresh tasks</button><div id="board"></div></main><script>
window.fixtureResult='success';
window.fetchTasks=async function(){await new Promise(resolve=>setTimeout(resolve,120));if(window.fixtureResult==='error')throw new Error('Service unavailable');if(window.fixtureResult==='denied'){const e=new Error('Access denied');e.status=403;throw e}if(window.fixtureResult==='empty')return [];return [{name:'Pump A',owner:'Jo',status:'Needs inspection',count:0},{name:'Valve B',owner:'Lee',status:'Ready',count:2}]};
async function loadTasks(){const tasks=await window.fetchTasks();document.querySelector('#board').innerHTML='<table><caption>Current tasks</caption><thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Open issues</th></tr></thead><tbody>'+tasks.map(t=>'<tr><td>'+t.name+'</td><td>'+t.owner+'</td><td>'+t.status+'</td><td>'+t.count+'</td></tr>').join('')+'</tbody></table>'}document.querySelector('#reload').addEventListener('click',loadTasks);loadTasks();
</script></html>
